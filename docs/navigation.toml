# Display choices only. Article identities, titles, questions and topic membership
# belong to article_inventory.toml; publication.toml owns source-to-page routes.
schema_version = 1
sidebar_threshold = 10

[anchors]
home = "index.html"
install = "start/install.html"
learning = "reading_map.html"
topics = "topic_map.html"
contributing = "contributing/index.html"

# These explanations serve readers of the results. Give them one home beside
# the reports while retaining their editorial types in the article inventory.
[article_collections]
benchmarking = "benchmarks"
benchmark_reproduction = "benchmarks"

[[collections]]
id = "mathematics"
title = "Mathematics"
page = "collections/mathematics.html"
types = ["lesson"]
order = ["ring", "two_parameters", "persistence_modules", "finite_encodings", "square", "indicator_presentations", "tameness", "practical_tameness", "decomposition_lesson", "math_categories"]

[[collections]]
id = "using"
title = "Using TamerOp"
page = "collections/using.html"
types = ["library_guide"]
# Within each topic, introduce the object before deeper queries or comparisons.
# A topic title links to its authored overview; its arrow opens these articles.
# Give each article one menu home. Cross-collection entrances require a specific
# reader benefit, recorded beside their configuration; topical overlap is not enough.
order = [
    "ordinary_persistence", "guide_representatives",
    "guide_inputs", "guide_presentations", "guide_spaces_maps", "lazy_inspection", "compare_encodings",
    "guide_generated_submodules", "guide_decomposition", "guide_complexes", "guide_resolutions", "guide_derived",
    "ingestion_options", "multicover", "exact_grades", "rhomboid_depth",
    "guide_slices_diagrams", "exact_matching", "guide_generalized_rank",
    "guide_features", "guide_uncertainty",
    "visualization", "guide_live_inspection", "guide_comparisons", "guide_visualize_share",
    "numerical_algebra",
]

[[collections]]
id = "recipes"
title = "Task recipes"
page = "collections/recipes.html"
types = ["recipe"]
order = ["optional_integrations", "cdd_concurrency"]

[[collections]]
id = "api"
title = "API reference"
page = "collections/api.html"
types = ["api_reference"]
order = []

[[collections]]
id = "implementation"
title = "Implementation accounts"
page = "implementation/index.html"
types = ["implementation_account"]
order = ["B01"]

[[collections]]
id = "benchmarks"
title = "Benchmark results"
page = "benchmarks/index.html"
types = ["benchmark_report"]
order = ["benchmarking", "benchmark_reproduction", "C01", "C18", "C14", "C14_cpp", "C22", "visual_interaction"]

[[collections]]
id = "contributing"
title = "Contributing"
page = "contributing/index.html"
types = ["contributor_guide"]
order = ["contributing", "writing", "testing", "visualization_support", "documentation_build", "benchmark_suites", "benchmark_style", "releasing"]
primary = false

# Supporting records stay attached to their owners, outside article lists.
[[resources]]
id = "implementation_bibliography"
collection = "implementation"

[[resources]]
id = "qpa_data"
collection = "benchmarks"
owner = "C01"

[[resources]]
id = "phat_data"
collection = "benchmarks"
owner = "C18"

[[resources]]
id = "ripser_data"
collection = "benchmarks"
owner = "C14"

[[resources]]
id = "ripser_cpp_data"
collection = "benchmarks"
owner = "C14_cpp"

[[resources]]
id = "cubicalripser_data"
collection = "benchmarks"
owner = "C22"

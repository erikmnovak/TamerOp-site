<svg xmlns="http://www.w3.org/2000/svg" width="520" height="625" viewBox="0 0 520 625" role="img" aria-labelledby="title description">
<title id="title">The diamond draft fails path independence</title>
<desc id="description">All four stalks are rational one dimensional spaces. Solid arrows 1 to 2 and 2 to 4 have coefficient one. Dashed arrows 1 to 3 and 3 to 4 have coefficients one and two. The resulting maps from 1 to 4 differ, so this is an invalid draft, not a module.</desc>
<defs>
<marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#156b91"/></marker>
<marker id="orange-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b45323"/></marker>
</defs>
<rect width="520" height="625" fill="white"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="260" y="36" font-size="23" text-anchor="middle" fill="#25333b" font-weight="normal">A draft with two different composites</text>
<text x="260" y="73" font-size="22" text-anchor="middle" fill="#25333b" font-weight="normal">Every stalk is ℚ; arrows act by scalars.</text>
<path d="M 241 398 L 108 287" fill="none" stroke="#156b91" stroke-width="3" marker-end="url(#blue-arrow)"/>
<path d="M 107 239 L 238 134" fill="none" stroke="#156b91" stroke-width="3" marker-end="url(#blue-arrow)"/>
<path d="M 279 398 L 412 287" fill="none" stroke="#b45323" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#orange-arrow)"/>
<path d="M 413 239 L 282 134" fill="none" stroke="#b45323" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#orange-arrow)"/>
<circle cx="260" cy="416" r="27" fill="white" stroke="#46545e" stroke-width="2"/>
<text x="260" y="424" font-size="25" text-anchor="middle" fill="#25333b" font-weight="normal">1</text>
<circle cx="84" cy="263" r="27" fill="white" stroke="#46545e" stroke-width="2"/>
<text x="84" y="271" font-size="25" text-anchor="middle" fill="#25333b" font-weight="normal">2</text>
<circle cx="436" cy="263" r="27" fill="white" stroke="#46545e" stroke-width="2"/>
<text x="436" y="271" font-size="25" text-anchor="middle" fill="#25333b" font-weight="normal">3</text>
<circle cx="260" cy="116" r="27" fill="white" stroke="#46545e" stroke-width="2"/>
<text x="260" y="124" font-size="25" text-anchor="middle" fill="#25333b" font-weight="normal">4</text>
<text x="146" y="351" font-size="26" text-anchor="start" fill="#156b91" font-weight="normal">1</text>
<text x="153" y="180" font-size="26" text-anchor="start" fill="#156b91" font-weight="normal">1</text>
<text x="361" y="351" font-size="26" text-anchor="start" fill="#b45323" font-weight="normal">1</text>
<text x="358" y="180" font-size="26" text-anchor="start" fill="#b45323" font-weight="normal">2</text>
<path d="M 35 491 H 95" fill="none" stroke="#156b91" stroke-width="3"/>
<text x="112" y="499" font-size="23" text-anchor="start" fill="#156b91" font-weight="normal">1 → 2 → 4:   1 × 1 = 1</text>
<path d="M 35 539 H 95" fill="none" stroke="#b45323" stroke-width="3" stroke-dasharray="8 5"/>
<text x="112" y="547" font-size="23" text-anchor="start" fill="#b45323" font-weight="normal">1 → 3 → 4:   2 × 1 = 2</text>
<text x="260" y="596" font-size="22" text-anchor="middle" fill="#25333b" font-weight="normal">A module requires these maps to agree.</text>
</g>
</svg>

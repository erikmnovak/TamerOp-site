<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" role="img" aria-labelledby="title desc">
<title id="title">The four pieces of the filtered complex</title><desc id="desc">At spectral bidegrees (0,1), (1,1), (1,0), (2,0) sit K squared. Horizontal identity and T maps raise filtration. The middle vertical identity preserves filtration. A later differential follows a horizontal map, a lift against the vertical map, and the next horizontal map.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#465f72"/></marker></defs>
<rect x="1" y="1" width="558" height="428" rx="12" fill="#fff" stroke="#cbd5df"/>
<g font-family="DejaVu Sans, sans-serif" fill="#183549">
<text x="280" y="32" font-size="20" text-anchor="middle" font-weight="bold">The supplied pieces and their maps</text>
<path d="M60 334L526 334" fill="none" stroke="#465f72" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M60 334L60 71" fill="none" stroke="#465f72" stroke-width="2" marker-end="url(#arrow)"/>
<text x="513" y="369" font-size="19" text-anchor="middle" font-weight="normal">p</text>
<text x="34" y="77" font-size="19" text-anchor="middle" font-weight="normal">q</text>
<text x="125" y="359" font-size="17" text-anchor="middle" font-weight="normal">0</text>
<text x="295" y="359" font-size="17" text-anchor="middle" font-weight="normal">1</text>
<text x="465" y="359" font-size="17" text-anchor="middle" font-weight="normal">2</text>
<text x="39" y="261" font-size="17" text-anchor="middle" font-weight="normal">0</text>
<text x="39" y="136" font-size="17" text-anchor="middle" font-weight="normal">1</text>
<rect x="92" y="107" width="66" height="46" rx="7" fill="#eaf3fa" stroke="#547e9b"/>
<text x="125" y="137" font-size="23" text-anchor="middle" font-weight="normal">K²</text>
<rect x="262" y="107" width="66" height="46" rx="7" fill="#eaf3fa" stroke="#547e9b"/>
<text x="295" y="137" font-size="23" text-anchor="middle" font-weight="normal">K²</text>
<rect x="262" y="232" width="66" height="46" rx="7" fill="#eaf3fa" stroke="#547e9b"/>
<text x="295" y="262" font-size="23" text-anchor="middle" font-weight="normal">K²</text>
<rect x="432" y="232" width="66" height="46" rx="7" fill="#eaf3fa" stroke="#547e9b"/>
<text x="465" y="262" font-size="23" text-anchor="middle" font-weight="normal">K²</text>
<path d="M161 130L256 130" fill="none" stroke="#465f72" stroke-width="2" marker-end="url(#arrow)"/>
<text x="211" y="111" font-size="20" text-anchor="middle" font-weight="normal">I</text>
<path d="M295 229L295 157" fill="none" stroke="#465f72" stroke-width="2" marker-end="url(#arrow)"/>
<text x="315" y="198" font-size="20" text-anchor="start" font-weight="normal">I</text>
<path d="M331 255L426 255" fill="none" stroke="#465f72" stroke-width="2" marker-end="url(#arrow)"/>
<text x="379" y="237" font-size="20" text-anchor="middle" font-weight="normal">T</text>
<text x="125" y="186" font-size="14" text-anchor="middle" font-weight="normal">(p,t) = (0,1)</text>
<text x="295" y="84" font-size="14" text-anchor="middle" font-weight="normal">(p,t) = (1,2)</text>
<text x="290" y="298" font-size="14" text-anchor="middle" font-weight="normal">(p,t) = (1,1)</text>
<text x="465" y="298" font-size="14" text-anchor="middle" font-weight="normal">(p,t) = (2,2)</text>
<text x="280" y="398" font-size="17" text-anchor="middle" font-weight="normal">t = p + q;  I = identity;  T = diag(1,0).</text>
</g>

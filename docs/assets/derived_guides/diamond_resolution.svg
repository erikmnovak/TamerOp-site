<svg xmlns="http://www.w3.org/2000/svg" width="560" height="464" viewBox="0 0 560 464" role="img" aria-labelledby="title desc">
<title id="title">A resolution checked at each vertex</title><desc id="desc">The degree 2, degree 1 and degree 0 terms are P4, P2 plus P3 and P1. At vertex 4 the maps are a to (a,-a), then (b,c) to b+c. Other nonzero maps are identities.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#465f72"/></marker></defs>
<rect x="1" y="1" width="558" height="462" rx="12" fill="#fff" stroke="#cbd5df"/>
<g font-family="DejaVu Sans, sans-serif" fill="#183549">
<text x="280" y="32" font-size="19" text-anchor="middle" font-weight="bold">The diamond resolution at each vertex</text>
<text x="135" y="76" font-size="21" text-anchor="middle" font-weight="normal">P₄</text>
<text x="260" y="76" font-size="21" text-anchor="middle" font-weight="normal">P₂ ⊕ P₃</text>
<text x="380" y="76" font-size="21" text-anchor="middle" font-weight="normal">P₁</text>
<text x="485" y="76" font-size="21" text-anchor="middle" font-weight="normal">M</text>
<text x="198" y="50" font-size="17" text-anchor="middle" font-weight="normal">d₂</text>
<text x="320" y="50" font-size="17" text-anchor="middle" font-weight="normal">d₁</text>
<text x="432" y="50" font-size="17" text-anchor="middle" font-weight="normal">ε</text>
<rect x="16" y="98" width="528" height="53" rx="6" fill="#f5f7f9"/>
<text x="60" y="134" font-size="17" text-anchor="middle" font-weight="normal">v = 1</text>
<text x="135" y="134" font-size="22" text-anchor="middle" font-weight="normal">0</text>
<text x="260" y="134" font-size="22" text-anchor="middle" font-weight="normal">0</text>
<text x="380" y="134" font-size="22" text-anchor="middle" font-weight="normal">K</text>
<text x="485" y="134" font-size="22" text-anchor="middle" font-weight="normal">K</text>
<path d="M159 127L233 127" fill="none" stroke="#465f72" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M284 127L353 127" fill="none" stroke="#465f72" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M404 127L458 127" fill="none" stroke="#465f72" stroke-width="2" marker-end="url(#arrow)"/>
<text x="432.5" y="119" font-size="15" text-anchor="middle" font-weight="normal">1</text>
<rect x="16" y="164" width="528" height="53" rx="6" fill="#f5f7f9"/>
<text x="60" y="200" font-size="17" text-anchor="middle" font-weight="normal">v = 2</text>
<text x="135" y="200" font-size="22" text-anchor="middle" font-weight="normal">0</text>
<text x="260" y="200" font-size="22" text-anchor="middle" font-weight="normal">K</text>
<text x="380" y="200" font-size="22" text-anchor="middle" font-weight="normal">K</text>
<text x="485" y="200" font-size="22" text-anchor="middle" font-weight="normal">0</text>
<path d="M159 193L233 193" fill="none" stroke="#465f72" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M284 193L353 193" fill="none" stroke="#465f72" stroke-width="2" marker-end="url(#arrow)"/>
<text x="320.0" y="185" font-size="15" text-anchor="middle" font-weight="normal">1</text>
<path d="M404 193L458 193" fill="none" stroke="#465f72" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="230" width="528" height="53" rx="6" fill="#f5f7f9"/>
<text x="60" y="266" font-size="17" text-anchor="middle" font-weight="normal">v = 3</text>
<text x="135" y="266" font-size="22" text-anchor="middle" font-weight="normal">0</text>
<text x="260" y="266" font-size="22" text-anchor="middle" font-weight="normal">K</text>
<text x="380" y="266" font-size="22" text-anchor="middle" font-weight="normal">K</text>
<text x="485" y="266" font-size="22" text-anchor="middle" font-weight="normal">0</text>
<path d="M159 259L233 259" fill="none" stroke="#465f72" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M284 259L353 259" fill="none" stroke="#465f72" stroke-width="2" marker-end="url(#arrow)"/>
<text x="320.0" y="251" font-size="15" text-anchor="middle" font-weight="normal">1</text>
<path d="M404 259L458 259" fill="none" stroke="#465f72" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="296" width="528" height="53" rx="6" fill="#eef4fa"/>
<text x="60" y="332" font-size="17" text-anchor="middle" font-weight="normal">v = 4</text>
<text x="135" y="332" font-size="22" text-anchor="middle" font-weight="normal">K</text>
<text x="260" y="332" font-size="22" text-anchor="middle" font-weight="normal">K²</text>
<text x="380" y="332" font-size="22" text-anchor="middle" font-weight="normal">K</text>
<text x="485" y="332" font-size="22" text-anchor="middle" font-weight="normal">0</text>
<path d="M159 325L233 325" fill="none" stroke="#465f72" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M284 325L353 325" fill="none" stroke="#465f72" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M404 325L458 325" fill="none" stroke="#465f72" stroke-width="2" marker-end="url(#arrow)"/>
<text x="280" y="391" font-size="19" text-anchor="middle" font-weight="normal">At v = 4:  d₂(a) = (a, −a)</text>
<text x="280" y="421" font-size="18" text-anchor="middle" font-weight="normal">d₁(b,c) = b + c,   so ker d₁ = im d₂.</text>
<text x="280" y="448" font-size="15" text-anchor="middle" font-weight="normal">K = ℚ; zero terms beyond the displayed ends.</text>
</g>
</svg>

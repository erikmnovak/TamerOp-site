<svg xmlns="http://www.w3.org/2000/svg" width="520" height="548" viewBox="0 0 520 548" role="img" aria-labelledby="title desc">
<title id="title">The addition map induced on two colimits</title>
<desc id="desc">Two modules on 1 below 2 and 3. M has spaces zero, k, k and zero arrows; N has k at every vertex and identity arrows. The natural map is identity at 2 and 3. After collapsing the poset to one point, the colimits are k squared and k, and the induced map sends x,y to x+y.</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#156b91"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b45323"/></marker>
</defs>
<rect width="520" height="548" fill="white"/>
<g font-family="DejaVu Sans,sans-serif">
<text x="260" y="35" font-size="25" text-anchor="middle" fill="#25333b">An induced map between colimits</text>
<text x="130" y="85" font-size="22" text-anchor="middle" fill="#25333b">M = (0, k, k)</text>
<text x="390" y="85" font-size="22" text-anchor="middle" fill="#25333b">N = (k, k, k)</text>
<text x="65" y="143" font-size="22" text-anchor="middle" fill="#25333b">2: k</text>
<text x="195" y="143" font-size="22" text-anchor="middle" fill="#25333b">3: k</text>
<text x="130" y="262" font-size="22" text-anchor="middle" fill="#25333b">1: 0</text>
<path d="M120 230 L74 161" stroke="#156b91" stroke-width="2.6" fill="none" marker-end="url(#blue)"/>
<path d="M140 230 L186 161" stroke="#156b91" stroke-width="2.6" fill="none" marker-end="url(#blue)"/>
<text x="79" y="210" font-size="20" text-anchor="middle" fill="#25333b">0</text>
<text x="181" y="210" font-size="20" text-anchor="middle" fill="#25333b">0</text>
<text x="325" y="143" font-size="22" text-anchor="middle" fill="#25333b">2: k</text>
<text x="455" y="143" font-size="22" text-anchor="middle" fill="#25333b">3: k</text>
<text x="390" y="262" font-size="22" text-anchor="middle" fill="#25333b">1: k</text>
<path d="M380 230 L334 161" stroke="#156b91" stroke-width="2.6" fill="none" marker-end="url(#blue)"/>
<path d="M400 230 L446 161" stroke="#156b91" stroke-width="2.6" fill="none" marker-end="url(#blue)"/>
<text x="339" y="210" font-size="20" text-anchor="middle" fill="#25333b">1</text>
<text x="441" y="210" font-size="20" text-anchor="middle" fill="#25333b">1</text>
<text x="260" y="305" font-size="21" text-anchor="middle" fill="#25333b">The map M → N is identity at 2 and 3.</text>
<text x="260" y="337" font-size="21" text-anchor="middle" fill="#25333b">At 1 it is the unique map 0 → k.</text>
<path d="M30 360 H490" stroke="#c8d5dc"/>
<text x="130" y="402" font-size="24" text-anchor="middle" fill="#25333b">colim M = k²</text>
<text x="390" y="402" font-size="24" text-anchor="middle" fill="#25333b">colim N = k</text>
<text x="130" y="441" font-size="23" text-anchor="middle" fill="#25333b">(x, y)</text>
<path d="M208 434 L308 434" stroke="#b45323" stroke-width="2.6" fill="none" marker-end="url(#orange)"/>
<text x="390" y="441" font-size="23" text-anchor="middle" fill="#25333b">x + y</text>
<text x="260" y="486" font-size="21" text-anchor="middle" fill="#25333b">In N, the relations identify e₁ = e₂ = e₃.</text>
<text x="260" y="519" font-size="21" text-anchor="middle" fill="#25333b">Thus x e₂ + y e₃ becomes (x + y) e₃.</text>
</g></svg>

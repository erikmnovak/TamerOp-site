<svg xmlns="http://www.w3.org/2000/svg" width="520" height="690" viewBox="0 0 520 690" role="img" aria-labelledby="title desc">
<title id="title">One vector in two coordinate bases</title>
<desc id="desc">The old basis is E equals e1, e2. The new basis is F equals e1, e1 plus e2. The vector e1 plus e2 has E coordinates one, one and F coordinates zero, one. Applying S changes the F coordinates to E coordinates. Applying A in the old basis or AS in the new basis gives the same answer, three.</desc>
<!-- Authored schematic; regenerate with render_serialization_figures.py. -->
<rect width="520" height="690" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#526576"/></marker></defs>
<g font-family="DejaVu Sans, sans-serif" fill="#172b42" text-anchor="middle">
<text x="260" y="36" font-size="27" fill="#172b42">One vector: x = e₁ + e₂</text>
<text x="260" y="81" font-size="24" fill="#245c99">Old basis E = (e₁, e₂)</text>
<text x="260" y="117" font-size="24" fill="#9a470b">New basis F = (e₁, e₁ + e₂)</text>
<text x="97" y="180" font-size="25" fill="#9a470b">[x]F</text>
<path d="M 79 201 H 71 V 271 H 79 M 115 201 H 123 V 271 H 115" fill="none" stroke="#9a470b" stroke-width="2"/>
<text x="97" y="226" font-size="29" fill="#9a470b">0</text>
<text x="97" y="261" font-size="29" fill="#9a470b">1</text>
<text x="413" y="249" font-size="34" fill="#172b42">3</text>
<path d="M 152 239 H 364" fill="none" stroke="#526576" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="261" y="213" font-size="24" fill="#9a470b">AS = [1  3]</text>
<path d="M 97 299 V 451" fill="none" stroke="#526576" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="225" y="360" font-size="24" fill="#172b42">S converts F</text>
<text x="225" y="393" font-size="24" fill="#172b42">coordinates to E</text>
<text x="413" y="388" font-size="32" fill="#172b42">=</text>
<text x="97" y="478" font-size="25" fill="#245c99">[x]E</text>
<path d="M 79 497 H 71 V 567 H 79 M 115 497 H 123 V 567 H 115" fill="none" stroke="#245c99" stroke-width="2"/>
<text x="97" y="522" font-size="29" fill="#245c99">1</text>
<text x="97" y="557" font-size="29" fill="#245c99">1</text>
<text x="413" y="545" font-size="34" fill="#172b42">3</text>
<path d="M 152 535 H 364" fill="none" stroke="#526576" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="261" y="508" font-size="24" fill="#245c99">A = [1  2]</text>
<text x="260" y="616" font-size="25" fill="#172b42">Same vector and same image.</text>
<text x="260" y="655" font-size="24" fill="#172b42">The matrix depends on the basis.</text>
</g></svg>

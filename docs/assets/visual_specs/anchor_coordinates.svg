<title id="title">One data anchor in two horizontal windows</title>
<desc id="description">The same data point (1,1) appears in two axis windows. Both vertical axes run from zero to two. The first horizontal axis runs from zero to two, placing the point halfway across; the second runs from zero to four, placing it one quarter across. A connector must use the updated pixel position.</desc>

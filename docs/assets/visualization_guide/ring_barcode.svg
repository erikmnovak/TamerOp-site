<svg xmlns="http://www.w3.org/2000/svg" width="520" height="570" viewBox="0 0 520 570" role="img" aria-labelledby="title description">
<title id="title">A ring and its interval in first homology</title>
<desc id="description">Over F2, the eight outer maximal cells of a three by three cubical image enter at zero. The central cell enters at five. Their faces enter with them. First homology is one dimensional from zero included to five excluded. This schematic identifies the interval without choosing a cycle from the reduction.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="520" height="752" viewBox="0 0 520 752" role="img" aria-labelledby="title description">
<title id="title">Ranks from a fixed source in the square module</title>
<desc id="description">The module is rational one dimensional on the closed square from zero to two in both coordinates and zero elsewhere. With source p=(1,1), targets q in the closed square from one to two have rank one. Comparable targets outside the support have rank zero. If either target coordinate is less than one, there is no forward structure map from p. All parameters in this example are represented. The finite viewing box is zero to three.</desc>
<!-- Authored schematic; regenerate with docs/build_scripts/render_visualization_guide_figures.py. -->
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#245c99" stroke-width="1.5"/></marker></defs>
<rect width="520" height="752" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="#172b42" text-anchor="middle">
<text x="260" y="38" font-size="26" fill="#172b42" text-anchor="middle">Keep p = (1, 1) fixed</text>
<text x="260" y="77" font-size="23" fill="#172b42" text-anchor="middle">Vary the target q = (x, y)</text>
<rect x="102" y="100" width="318" height="318" fill="white" stroke="#a0acb8" stroke-width="1"/>
<rect x="102" y="100" width="106" height="318" fill="#e2e8f0" stroke="none" stroke-width="1"/>
<rect x="208" y="312" width="212" height="106" fill="#e2e8f0" stroke="none" stroke-width="1"/>
<rect x="208" y="206" width="106" height="106" fill="#aacfe5" stroke="#245c99" stroke-width="3"/>
<path d="M 208 312 L 208 100" fill="none" stroke="#245c99" stroke-width="2" stroke-dasharray=""/>
<path d="M 208 312 L 420 312" fill="none" stroke="#245c99" stroke-width="2" stroke-dasharray=""/>
<path d="M 102 418 L 440 418" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/>
<path d="M 102 418 L 102 80" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/>
<text x="102" y="451" font-size="22" fill="#172b42" text-anchor="middle">0</text>
<text x="75" y="426" font-size="22" fill="#172b42" text-anchor="middle">0</text>
<text x="208" y="451" font-size="22" fill="#172b42" text-anchor="middle">1</text>
<text x="75" y="320" font-size="22" fill="#172b42" text-anchor="middle">1</text>
<text x="314" y="451" font-size="22" fill="#172b42" text-anchor="middle">2</text>
<text x="75" y="214" font-size="22" fill="#172b42" text-anchor="middle">2</text>
<text x="420" y="451" font-size="22" fill="#172b42" text-anchor="middle">3</text>
<text x="75" y="108" font-size="22" fill="#172b42" text-anchor="middle">3</text>
<text x="455" y="426" font-size="24" fill="#172b42" text-anchor="middle">x</text>
<text x="100" y="62" font-size="24" fill="#172b42" text-anchor="middle">y</text>
<text x="261.0" y="268.0" font-size="23" fill="#172b42" text-anchor="middle">rank 1</text>
<text x="319.29999999999995" y="150.39999999999998" font-size="23" fill="#172b42" text-anchor="middle">rank 0</text>
<text x="280.08" y="381.48" font-size="22" fill="#475569" text-anchor="middle">no forward map</text>
<circle cx="208" cy="312" r="7" fill="#b45309" stroke="#b45309" stroke-width="2.5"/>
<text x="224" y="344" font-size="24" fill="#b45309" text-anchor="start">p</text>
<text x="260" y="499" font-size="23" fill="#172b42" text-anchor="middle">Blue: p ≤ q inside the support</text>
<text x="260" y="534" font-size="25" fill="#245c99" text-anchor="middle">M(p ≤ q) = [1]</text>
<text x="260" y="581" font-size="23" fill="#172b42" text-anchor="middle">White: p ≤ q outside the support</text>
<text x="260" y="616" font-size="25" fill="#172b42" text-anchor="middle">M(p ≤ q): ℚ → 0</text>
<text x="260" y="663" font-size="23" fill="#172b42" text-anchor="middle">Gray: x &lt; 1 or y &lt; 1</text>
<text x="260" y="698" font-size="22" fill="#475569" text-anchor="middle">The order supplies no map from p.</text>
<text x="260" y="737" font-size="21" fill="#475569" text-anchor="middle">The top and right frame only crop the view.</text>
</g></svg>

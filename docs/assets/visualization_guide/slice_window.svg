<svg xmlns="http://www.w3.org/2000/svg" width="520" height="713" viewBox="0 0 520 713" role="img" aria-labelledby="title description">
<title id="title">Full diagonal intervals and a smaller window</title>
<desc id="description">The direct sum of the closed square modules [0,2]^2 and [1,3]^2 restricts to closed intervals [0,2] and [1,3] on q(t)=(t,t). The window from t=3/2 to t=7/4 meets both intervals. Restricting the computation to that window returns two copies of the closed interval [3/2,7/4] with both ends censored. The restricted answer establishes multiplicity two in the window but does not determine the ambient endpoints. The lower panel magnifies the window and has a different scale.</desc>
<!-- Authored schematic; regenerate with docs/build_scripts/render_visualization_guide_figures.py. -->
